services:
  wage-tracker:
    build: .
    container_name: wage-tracker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/app/data
    ports:
      - "8095:8000"
    environment:
      - TZ=Asia/Shanghai
      - WAGE_USERNAME=${WAGE_USERNAME:-admin}
      - WAGE_PASSWORD=${WAGE_PASSWORD:-}
