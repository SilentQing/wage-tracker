name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node --check static/payroll.js
      - run: node --check static/backups.js
      - run: node --check static/submissions.js
